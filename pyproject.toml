[project]
name = "development-flow-local"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.1.0,<4.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0"
]

[tool.uv]
add-bounds = "major"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.17.3,<0.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
