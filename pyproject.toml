[project]
name = "development-flow-local"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.1.0,<4.0.0",
    "protobuf>=6.33.5,<7.0.0",
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "setuptools>=84.2.1,<85.0.0",
    "soda-core-postgres==3.5.6",
]

[tool.uv]
add-bounds = "major"
exclude-newer = "7 days"

[dependency-groups]
airflow = [
    "apache-airflow-providers-standard>=1.21.0,<2.0.0 ; sys_platform == 'linux'",
    "apache-airflow[celery,fab,postgres]==3.4.0 ; sys_platform == 'linux'",
    "celery[redis]>=5.6.0,<5.7.0 ; sys_platform == 'linux'",
    "dnspython>=2.9.2,<3.0.0 ; sys_platform == 'linux'",
    "msgpack>=1.2.3,<2.0.0 ; sys_platform == 'linux'",
    "pip>=26.3,<27.0.0 ; sys_platform == 'linux'",
    "urllib3>=2.8.0,<3.0.0 ; sys_platform == 'linux'",
]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.17.3,<0.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "e2e: triggers a live Airflow DAG run through Docker Compose",
    "integration: requires Airflow, the PostgreSQL provider, and a live warehouse database",
]
