name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run pytest
        run: uv run python -m pytest -v --junitxml=.ci/reports/unit-tests.xml

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Validate GitHub Actions syntax and shell commands
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-test-report-${{ github.sha }}
          path: .ci/reports/unit-tests.xml
          retention-days: 7

  airflow:
    name: Image, Airflow, database, and E2E
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: products-ci
      COMPOSE_ENV_FILES: .env.ci
      AIRFLOW_ENV_FILE: .env.ci
      CI_TEST_IMAGE: ci/products-elt-test:${{ github.sha }}
      RUNTIME_IMAGE: ci/products-elt:${{ github.sha }}
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install locked host test dependencies
        run: uv sync --locked --dev

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main

      - name: Prepare disposable environment
        run: |
          uv run python scripts/ci/prepare_environment.py
          docker compose config --quiet

      - name: Build release runtime and test extension
        run: |
          docker build --target production --tag "$RUNTIME_IMAGE" .
          docker build --target test --build-arg TEST_RUNTIME_IMAGE="$RUNTIME_IMAGE" --tag "$CI_TEST_IMAGE" .

      - name: Start disposable Airflow stack
        run: docker compose up --no-build --wait --wait-timeout 300

      - name: Wait for and unpause DAGs
        run: uv run python scripts/ci/wait_for_dags.py

      - name: Validate real Airflow DAG imports and structure
        run: |
          docker compose exec -T airflow-worker python -m pytest \
            /opt/airflow/tests/unit_test.py -v --junitxml=/tmp/dag-tests.xml

      - name: Test real warehouse connection
        run: |
          docker compose exec -T airflow-worker python -m pytest \
            /opt/airflow/tests/integration_test.py --run-integration -v \
            --junitxml=/tmp/integration-tests.xml

      - name: Run orchestration and ELT end to end
        run: |
          uv run pytest tests/test_airflow_e2e.py --run-e2e -v -s \
            --junitxml=.ci/reports/e2e-tests.xml

      - name: Generate runtime SBOM
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.ci/reports:/reports" "$TRIVY_IMAGE" image \
            --format cyclonedx --output /reports/sbom.cdx.json "$RUNTIME_IMAGE"

      - name: Gate fixable high and critical image vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.ci/reports:/reports" "$TRIVY_IMAGE" image \
            --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --format json --output /reports/vulnerabilities.json \
            --exit-code 1 "$RUNTIME_IMAGE"

      - name: Save validated release image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save "$RUNTIME_IMAGE" | gzip > .ci/runtime-image.tar.gz

      - name: Transfer validated release image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image-${{ github.sha }}
          path: .ci/runtime-image.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Collect stack diagnostics and container reports
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .ci/reports
          docker compose ps --all > .ci/reports/compose-status.txt 2>&1
          docker compose logs --no-color > .ci/reports/compose.log 2>&1
          # Task exceptions are stored in files and may be absent from container stdout.
          docker cp airflow-worker:/opt/airflow/logs .ci/reports/task-logs || true
          docker cp airflow-worker:/tmp/dag-tests.xml .ci/reports/dag-tests.xml || true
          docker cp airflow-worker:/tmp/integration-tests.xml .ci/reports/integration-tests.xml || true

      - name: Upload reports, SBOM, and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-reports-${{ github.sha }}
          path: .ci/reports/
          retention-days: 7

      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish validated release image
    needs: [checks, airflow]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-image-${{ github.sha }}
          path: .ci

      - name: Load image and determine release tags
        run: |
          gunzip -c .ci/runtime-image.tar.gz | docker load
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the tested runtime without rebuilding
        id: push
        run: |
          docker tag "ci/products-elt:$GITHUB_SHA" "$IMAGE:$VERSION"
          docker tag "ci/products-elt:$GITHUB_SHA" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          reference=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          echo "digest=${reference#*@}" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE:$VERSION ($reference)" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
